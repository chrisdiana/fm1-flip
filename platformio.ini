[platformio]
default_envs = cardputer, sticks3

[env]
board_upload.maximum_size = 3145728
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
extra_scripts = pre:tools/embed_assets.py
monitor_speed = 115200
# The removed cloud logger must not wrap Arduino logging at link time.
build_unflags = -Wl,--wrap=log_printf
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
  -I src/transport
  # Activates the Arduino core's panic hook (esp32-hal-misc.c), which
  # crash_record.cpp uses to keep crash details for the next session log.
  -Wl,--wrap=esp_panic_handler
lib_deps =
  m5stack/M5Unified@0.2.13
  m5stack/M5GFX@0.3.0
  bblanchon/ArduinoJson@7.2.1
build_src_filter = +<main.cpp> +<core/> +<device/> +<transport/>

[env:cardputer]
# Rebuild IDF USB enumeration: composite FM-1 descriptors can exceed the stock 256-byte limit.
custom_sdkconfig =
  CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE=1024
  CONFIG_SPIRAM=n
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
  CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  CONFIG_MBEDTLS_SSL_VARIABLE_BUFFER_LENGTH=n
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
# Unused cloud components also trigger unsupported generated-certificate rules in HybridCompile.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
board = m5stack-stamps3
board_build.partitions = partitions/cardputer.csv
# HybridCompile exports archives, but not IDF's dynamic-buffer linker options.
build_flags = ${env.build_flags} -DFM1_CARDPUTER=1
  -Wl,--wrap=mbedtls_ssl_write_client_hello
  -Wl,--wrap=mbedtls_ssl_handshake_client_step
  -Wl,--wrap=mbedtls_ssl_tls13_handshake_client_step
  -Wl,--wrap=mbedtls_ssl_handshake_server_step
  -Wl,--wrap=mbedtls_ssl_read
  -Wl,--wrap=mbedtls_ssl_write
  -Wl,--wrap=mbedtls_ssl_session_reset
  -Wl,--wrap=mbedtls_ssl_free
  -Wl,--wrap=mbedtls_ssl_setup
  -Wl,--wrap=mbedtls_ssl_send_alert_message
  -Wl,--wrap=mbedtls_ssl_close_notify
lib_deps = ${env.lib_deps}
  m5stack/M5Cardputer@1.1.1
  z3t0/IRremote@5.0.0

[env:sticks3]
custom_sdkconfig =
  CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE=1024
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
# Unused cloud components also trigger unsupported generated-certificate rules in HybridCompile.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/sticks3.csv
build_flags = ${env.build_flags} -DFM1_STICKS3=1 -DBOARD_HAS_PSRAM

# Legacy build command alias; both Cardputer models use the same runtime-detected build.
[env:cardputer-adv]
extends = env:cardputer
